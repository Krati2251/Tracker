name: CI/CD

on:
  push:
    branches:
      - main
      - cicd-setup
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo apt update
            sudo apt install docker.io -y
            cd /home/ubuntu
            git clone https://github.com/YOUR_REPO.git || true
            cd YOUR_REPO
            git pull
            sudo docker stop finance-app || true
            sudo docker rm finance-app || true
            sudo docker build -t finance-app .
            sudo docker run -d -p 8501:8501 --name finance-app finance-app
