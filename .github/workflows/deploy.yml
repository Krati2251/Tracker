script: |
  cd /home/ubuntu

  if [ ! -d "Tracker" ]; then
    git clone https://github.com/Krati2251/Tracker.git
  fi

  cd Tracker
  git pull

  docker stop finance-app || true
  docker rm finance-app || true

  docker build -t finance-app .
  docker run -d -p 8501:8501 --name finance-app finance-app
