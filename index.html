<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinanceFlow | Smart Money Moves</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-orb orb-left" aria-hidden="true"></div>
    <div class="bg-orb orb-right" aria-hidden="true"></div>

    <main class="container">
      <section class="hero">
        <p class="eyebrow">Personal Finance Dashboard</p>
        <h1>Track your money with confidence.</h1>
        <p class="subtitle">
          View spending, monitor savings, and understand your financial health in one simple place.
        </p>
        <button class="cta" type="button">Get Started</button>
      </section>

      <section class="stats" aria-label="Financial highlights">
        <article class="card">
          <h2>Monthly Budget</h2>
          <p class="value">$4,500</p>
          <p class="note">Set plan for this month</p>
        </article>
        <article class="card">
          <h2>Total Savings</h2>
          <p class="value">$12,800</p>
          <p class="note">+8.2% from last quarter</p>
        </article>
        <article class="card">
          <h2>Investments</h2>
          <p class="value">$19,200</p>
          <p class="note">Diversified portfolio</p>
        </article>
      </section>
    </main>
  </body>
</html>
